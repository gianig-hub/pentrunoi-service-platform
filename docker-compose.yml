services:
  db:
    image: postgres:16-alpine
    container_name: pentrunoi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pentrunoi
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: pentrunoi_service_platform
    volumes:
      - pentrunoi_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"

  app:
    image: node:22-bookworm-slim
    container_name: pentrunoi_app
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - db
    env_file:
      - .env
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://pentrunoi:change-me@db:5432/pentrunoi_service_platform?schema=public"
      UPLOADS_DIR: "/app/uploads"
    volumes:
      - ./:/app
      - pentrunoi_uploads:/app/uploads
    command: sh -lc "npm install --no-audit --no-fund && npx prisma generate && npm run dev -- -H 0.0.0.0 -p 3000"
    expose:
      - "3000"
    networks:
      - default
      - webproxy

volumes:
  pentrunoi_db_data:
  pentrunoi_uploads:

networks:
  webproxy:
    external: true
