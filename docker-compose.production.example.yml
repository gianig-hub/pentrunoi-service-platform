services:
  db:
    image: postgres:16-alpine
    container_name: pentrunoi_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pentrunoi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pentrunoi_service_platform}
    volumes:
      - pentrunoi_prod_db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pentrunoi} -d ${POSTGRES_DB:-pentrunoi_service_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pentrunoi_prod_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      UPLOADS_DIR: /app/uploads
    volumes:
      - pentrunoi_prod_uploads:/app/uploads
    expose:
      - "3000"
    networks:
      - internal
      - webproxy

volumes:
  pentrunoi_prod_db_data:
  pentrunoi_prod_uploads:

networks:
  internal:
    driver: bridge
  webproxy:
    external: true
